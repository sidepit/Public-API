name: Python package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and build tools
        run: python -m pip install . build pytest twine
      - name: Source tests
        run: python -m pytest -q python-client/tests
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check metadata and archive contents
        run: |
          python -m twine check --strict dist/*
          python tools/check_python_dist.py dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Smoke-test installed package outside checkout
        working-directory: ${{ runner.temp }}
        env:
          SIDEPIT_TESTNET: "true"
          SIDEPIT_DEPOSIT_ADDRESS: bc1ql3e9pgs3mmwuwrh95fecme0s0qtn2880lsvsd5
          SIDEPIT_KEYS_DIR: ${{ runner.temp }}/sidepit-empty-keys
          SIDEPIT_STATE_DB: ${{ runner.temp }}/sidepit-empty-state.db
          SIDEPIT_HOST: localhost
        run: |
          sidepit --help
          sidepit list
          python "$GITHUB_WORKSPACE/tools/smoke_installed_sidepit.py"
