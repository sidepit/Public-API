[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sidepit"
version = "0.1.0"
description = "The official Python SDK and trading terminal for Sidepit."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sidepit" }]
keywords = ["bitcoin", "exchange", "trading", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "protobuf==3.20.1",
    "pynng",
    "secp256k1",
    "base58",
    "ripemd-hash>=1.0.1",
    "bitcoinlib",
    "textual>=8.0",
    "qrcode>=7.0",
]

[project.scripts]
sidepit = "sidepit_tui.__main__:main"

[project.urls]
Homepage = "https://sidepit.com"
Documentation = "https://docs.sidepit.com"
Source = "https://github.com/sidepit/Public-API"

[tool.setuptools]
packages = [
    "sidepit_trader",
    "sidepit_trader.examples",
    "sidepit_trader.proto",
    "sidepit_trader.data",
    "sidepit_tui",
]

[tool.setuptools.package-dir]
sidepit_trader = "python-client/sidepit_trader"
"sidepit_trader.examples" = "python-client/sidepit_trader/examples"
"sidepit_trader.proto" = "python-client/proto"
"sidepit_trader.data" = "python-client/sidepit_trader/data"
sidepit_tui = "users-cli/sidepit_tui"

[tool.setuptools.package-data]
sidepit_trader = ["data/*.txt"]
