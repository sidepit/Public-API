[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sidepit"
version = "0.1.2"
description = "The official Python SDK and trading terminal for Sidepit."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sidepit" }]
keywords = ["bitcoin", "exchange", "trading", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
]
dynamic = ["dependencies"]   # see setup.py: pure vs bundled-secp256k1 builds

[project.scripts]
sidepit = "sidepit_tui.__main__:main"

[project.urls]
Homepage = "https://sidepit.com"
Documentation = "https://docs.sidepit.com"
Source = "https://github.com/sidepit/Public-API"
